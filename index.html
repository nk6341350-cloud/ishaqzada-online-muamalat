<!doctype html>
<html lang="ps" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073d72"><title>اسحاقزاده آنلاین معاملات</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#eef5fa;font-family:Arial,Tahoma,sans-serif;color:#082e58}
.site{max-width:1280px;margin:auto;background:#fff;min-height:100vh}
.visual{position:relative;width:100%;line-height:0;background:#fff}.visual img{display:block;width:100%;height:auto}
.hot{position:absolute;cursor:pointer;border:0;background:transparent;color:transparent;z-index:4}
.home{left:2%;top:32%;width:47%;height:15%}.cars{right:2%;top:32%;width:47%;height:15%}
.reg1{left:2%;top:48%;width:18%;height:10%}.reg2{left:20%;top:48%;width:18%;height:10%}
.ai{left:39%;top:48%;width:20%;height:10%}.search{left:60%;top:48%;width:18%;height:10%}.help{right:2%;top:48%;width:18%;height:10%}
.installA{right:24%;bottom:1%;width:22%;height:8%}.installI{right:2%;bottom:1%;width:21%;height:8%}
.mobilebar{display:none}
.modal{display:none;position:fixed;inset:0;background:#00152dde;z-index:30;padding:16px;align-items:center;justify-content:center;line-height:normal}.modal.on{display:flex}
.panel{background:#fff;width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:25px;padding:22px;box-shadow:0 20px 60px #0005}
.panel h2{margin-top:5px}.panel input,.panel select,.panel textarea{width:100%;padding:13px;margin:5px 0 12px;border:1px solid #ccd9e5;border-radius:12px}
.btn{border:0;border-radius:13px;padding:12px 18px;font-weight:800;background:#0757a5;color:#fff}.green{background:#07853f}.close{float:left;background:#edf2f7;color:#123}
.chat{height:260px;overflow:auto;background:#f1f7fb;border-radius:15px;padding:10px}.msg{background:#fff;padding:10px;border-radius:11px;margin:7px 0}
@media(max-width:700px){
 .site{width:100%}.visual{overflow:hidden}
 .visual img{width:178%;max-width:none;transform:translateX(22%);transform-origin:top center}
 .hot{display:none}
 .mobilebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;bottom:0;background:#fff;padding:9px;z-index:12;box-shadow:0 -3px 18px #1232}
 .mobilebar button{border:0;border-radius:13px;padding:12px 5px;background:#edf6ff;color:#0757a5;font-weight:800}
}
</style></head><body><main class="site">
<div class="visual">
<img src="assets/approved-design.jpg" alt="اسحاقزاده آنلاین معاملات">
<button class="hot home" onclick="info('رهنمایي معاملات')">رهنمایي معاملات</button>
<button class="hot cars" onclick="info('موټر پلورنځی')">موټر پلورنځی</button>
<button class="hot reg1" onclick="openReg('estate')">د رهنمایي ثبت</button>
<button class="hot reg2" onclick="openReg('carshop')">د موټر پلورنځي ثبت</button>
<button class="hot ai" onclick="openAI()">AI</button>
<button class="hot search" onclick="openSearch()">لټون</button>
<button class="hot help" onclick="info('لارښود')">لارښود</button>
<button class="hot installA" onclick="installApp()">Android نصب</button>
<button class="hot installI" onclick="installApp()">iPhone نصب</button>
</div>
<div class="mobilebar"><button onclick="openReg()">➕ ثبت</button><button onclick="openAI()">🤖 AI</button><button onclick="openSearch()">🔎 لټون</button></div>
</main>

<div id="reg" class="modal"><div class="panel"><button class="btn close" onclick="closeM('reg')">✕</button><h2>د کاروبار ثبت</h2>
<select id="rtype"><option value="estate">رهنمایي معاملات</option><option value="carshop">موټر پلورنځی</option></select>
<input placeholder="د رهنمایي / موټر پلورنځي نوم"><input placeholder="د مالک نوم">
<label>لوګو له ګالري څخه</label><input type="file" accept="image/*">
<input placeholder="ولایت"><input placeholder="ولسوالي / مرکز"><input placeholder="WhatsApp شمېره"><input placeholder="ټیلیفون شمېره">
<select><option>جواز لرم</option><option>جواز نه لرم</option></select><input placeholder="د جواز نمبر">
<label>د تذکرې مخ</label><input type="file" accept="image/*"><label>د تذکرې شا</label><input type="file" accept="image/*"><label>سلفي / عکس</label><input type="file" accept="image/*">
<button class="btn green" onclick="submitReg()">د اډمین تایید ته واستوئ</button></div></div>

<div id="aiBox" class="modal"><div class="panel"><button class="btn close" onclick="closeM('aiBox')">✕</button><h2>🤖 AI مرستیال</h2>
<div id="chat" class="chat"><div class="msg">سلام! د اسحاقزاده آنلاین معاملات په اړه پوښتنه وکړئ.</div></div>
<input id="ask" placeholder="پوښتنه ولیکئ"><button class="btn" onclick="askAI()">پوښتنه</button></div></div>

<div id="searchBox" class="modal"><div class="panel"><button class="btn close" onclick="closeM('searchBox')">✕</button><h2>🔎 د اعلان لټون</h2>
<input id="q" placeholder="کور، ځمکه، دوکان یا موټر"><select><option>ټول افغانستان</option><option>کندهار</option><option>کابل</option><option>هرات</option><option>بلخ</option></select>
<button class="btn" onclick="doSearch()">لټون</button></div></div>
<script src="app.js"></script></body></html>
